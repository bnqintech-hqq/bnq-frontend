name: Next.js Frontend Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # Node version update kar diya hai warning hatane ke liye

    - name: Install Dependencies
      run: npm install

    - name: Build Next.js App
      run: npm run build